# Explicit local build overlay only for dev/beta and CI.
# Uses a distinct local image name so source builds cannot shadow GHCR alpha.
services:
  opensigweave:
    image: opensigweave-source-test:local
    build:
      context: .
      dockerfile: Dockerfile
      labels:
        org.opencontainers.image.revision: ${OSW_BUILD_REVISION:-unverified}
    # The updater builds explicitly. One-off Alembic runs reuse that image.
    pull_policy: never
