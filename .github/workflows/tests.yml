name: Tests

on:
  push:
    branches: ["architecture/refactor-foundation"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opensigweave-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: opensigweave
          POSTGRES_USER: opensigweave
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opensigweave -d opensigweave"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Scan complete Git history for secrets
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --config=.gitleaks.toml --redact=100 --report-format=json --report-path=/tmp/gitleaks-report.json --exit-code=0 --log-opts="--all" .
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/gitleaks-report.json").read_text())
          print(f"Gitleaks findings: {len(report)}")
          for finding in report:
              print(
                  "rule={RuleID} file={File} commit={Commit} line={StartLine} fingerprint={Fingerprint}".format(
                      **finding
                  )
              )
          if report:
              raise SystemExit("Unallowlisted secrets detected in Git history")
          PY
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Check browser JavaScript syntax
        run: |
          node --check static/js/portal.js
          node --check static/js/logout.js
      - name: Test Alpine CSP evaluator in a DOM
        run: |
          npm install --no-save --package-lock=false @alpinejs/csp@3.17.5 jsdom@26.1.0
          node tests/frontend_csp_smoke.cjs
      - name: Verify Alpine CSP CDN artifact and calculate SRI
        run: |
          curl -fsSLo /tmp/alpine-csp.min.js https://cdn.jsdelivr.net/npm/@alpinejs/csp@3.17.5/dist/cdn.min.js
          printf 'Alpine CSP SRI: sha384-'
          openssl dgst -sha384 -binary /tmp/alpine-csp.min.js | base64 -w0
          echo
      - name: Check backup automation shell syntax
        run: bash -n scripts/backup_to_mounted_storage.sh
      - name: Test scheduled backup remote-filesystem guards
        run: bash tests/scheduled_backup_smoke.sh
      - name: Check Rspamd Lua syntax
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
          luac5.1 -p rspamd/opensigweave.lua
      - name: Test PostgreSQL schema migrations
        env:
          DATABASE_URL: postgresql+psycopg://opensigweave:ci-password@127.0.0.1:5432/opensigweave
          POSTGRES_PASSWORD: ci-password
        run: alembic upgrade head
      - name: Test SQLite schema migrations
        env:
          DATABASE_URL: sqlite:///./ci_test.db
        run: alembic upgrade head
      - name: Install Chromium for real-browser smoke test
        run: |
          npm install --no-save --package-lock=false playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Build and smoke-test standalone Docker stack
        run: |
          postgres_password='ci-password'
          session_key="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          engine_key="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          local_admin_hash="$(python -c 'from auth_config import hash_local_admin_password; print(hash_local_admin_password("ci-local-admin-password"))')"
          cat > .env <<EOF
          POSTGRES_DB=opensigweave
          POSTGRES_USER=opensigweave
          POSTGRES_PASSWORD=$postgres_password
          SECRET_KEY=$session_key
          ENGINE_API_KEY=$engine_key
          OIDC_ENABLED=false
          APP_ALLOWED_HOSTS=signature.example.test
          LOCAL_ADMIN_EMAIL=admin@example.test
          LOCAL_ADMIN_PASSWORD_HASH='$local_admin_hash'
          EOF
          trap 'docker compose down --volumes' EXIT
          docker compose config --quiet
          docker compose up -d --build --wait --wait-timeout 120
          docker compose exec -T opensigweave alembic current
          if ! login_page="$(curl --fail --silent --show-error -H 'Host: signature.example.test' http://127.0.0.1:8085/login)"; then
            docker compose logs --no-color opensigweave
            exit 1
          fi
          grep -q "Use email and password for LDAP" <<<"$login_page"
          BROWSER_TEST_EMAIL="admin@example.test" BROWSER_TEST_PASSWORD="ci-local-admin-password" node tests/browser_smoke.cjs
          engine_header="$(printf '%s: %s' 'X-Engine-Key' "$engine_key")"
          response="$(curl --fail --silent --show-error -H 'Host: signature.example.test' -H "$engine_header" http://127.0.0.1:8085/api/signature/smoke@example.test)"
          python -c 'import json,sys; result=json.loads(sys.argv[1]); assert result["html"] == ""' "$response"
      - name: Install age for backup integration
        run: |
          sudo apt-get update
          sudo apt-get install -y age
      - name: Test full encrypted Docker backup and fresh restore
        run: bash tests/docker_backup_restore_e2e.sh
      - name: Run regression tests
        env:
          DATABASE_URL: postgresql+psycopg://opensigweave:ci-password@127.0.0.1:5432/opensigweave
          POSTGRES_PASSWORD: ci-password
        run: python -m unittest discover -s tests -v
