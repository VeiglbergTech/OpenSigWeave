name: Tests

on:
  push:
    branches: ["architecture/refactor-foundation"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opensigweave-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: opensigweave
          POSTGRES_USER: opensigweave
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opensigweave -d opensigweave"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Scan complete Git history for secrets
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --config=.gitleaks.toml --redact=100 --report-format=json --report-path=/tmp/gitleaks-report.json --exit-code=0 --log-opts="--all" .
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/gitleaks-report.json").read_text())
          print(f"Gitleaks findings: {len(report)}")
          for finding in report:
              print(
                  "rule={RuleID} file={File} commit={Commit} line={StartLine} fingerprint={Fingerprint}".format(
                      **finding
                  )
              )
          if report:
              raise SystemExit("Unallowlisted secrets detected in Git history")
          PY
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Check browser JavaScript syntax
        run: node --check static/js/portal.js
      - name: Check Rspamd Lua syntax
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
          luac5.1 -p rspamd/opensigweave.lua
      - name: Test PostgreSQL schema migrations
        env:
          DATABASE_URL: postgresql+psycopg://opensigweave:ci-password@127.0.0.1:5432/opensigweave
          POSTGRES_PASSWORD: ci-password
        run: alembic upgrade head
      - name: Test SQLite schema migrations
        env:
          DATABASE_URL: sqlite:///./ci_test.db
        run: alembic upgrade head
      - name: Run regression tests
        env:
          DATABASE_URL: postgresql+psycopg://opensigweave:ci-password@127.0.0.1:5432/opensigweave
          POSTGRES_PASSWORD: ci-password
        run: python -m unittest discover -s tests -v
