name: Attach verified minimal installer to approved GitHub Release

# This workflow never creates a Git tag, GitHub Release, Docker image or branch.
# A manually approved PUBLISHED STABLE release and its existing GHCR image
# must both be verified before an installer is attached. If the image was still
# building when the release event fired, a maintainer may retry explicitly.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Exact already-published stable GitHub Release tag"
        required: true
        type: string

permissions:
  contents: write
  packages: read

concurrency:
  group: opensigweave-release-installer-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'VeiglbergTech/OpenSigWeave'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out approved release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify published stable release and main ancestry
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.event.release.tag_name || inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$VERSION^{}")"
          python3 - <<'PY'
          import json, os, subprocess
          from scripts.release_bundle import TAG
          version = os.environ["VERSION"]
          if not TAG.fullmatch(version):
              raise SystemExit("Only approved stable YYYY.MM releases may receive an installer")
          row = json.loads(subprocess.check_output(
              ["gh", "api", f"repos/{os.environ['GH_REPO']}/releases/tags/{version}"]))
          if (row.get("draft") or row.get("prerelease") is not False or
              row.get("tag_name") != version or not row.get("published_at")):
              raise SystemExit("Published stable release metadata does not match the tag")
          main = subprocess.check_output(["git", "rev-parse", "origin/main"], text=True).strip()
          rev = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if subprocess.check_output(["git", "merge-base", rev, main], text=True).strip() != rev:
              raise SystemExit("Stable release must be an ancestor of approved main")
          PY
      - name: Verify the already-published version-specific GHCR image
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.release.tag_name || inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/veiglbergtech/opensigweave:$VERSION"
          REVISION="$(git rev-parse HEAD)"
          export DOCKER_CONFIG
          DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # Never publish an installer for a not-yet-built or unrelated image.
          docker pull "$IMAGE"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")" = "$REVISION"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$IMAGE")" = "$VERSION"
          docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$IMAGE" | grep -Fx "OSW_RELEASE_SHA=$REVISION"
          docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$IMAGE" | grep -Fx "OSW_RELEASE_TAG=$VERSION"
      - name: Run offline release packaging regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_release_bundle.py -v
          python3 -m unittest discover -s tests -p test_release_target.py -v
      - name: Build deterministic minimal host-side package
        env:
          VERSION: ${{ github.event.release.tag_name || inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          ASSET="opensigweave-$VERSION-install.tar.gz"
          python3 scripts/release_bundle.py --tag "$VERSION" --revision "$(git rev-parse HEAD)" --output "dist/$ASSET"
          sha256sum "dist/$ASSET"
          test "$(tar -tzf "dist/$ASSET" | wc -l)" -eq 13
      - name: Attach verified asset without replacing existing files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.event.release.tag_name || inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          ASSET="opensigweave-$VERSION-install.tar.gz"
          if gh release view "$VERSION" --json assets --jq '.assets[].name' | grep -Fx "$ASSET"; then
            echo "::error::Release installer asset already exists; refusing to overwrite"
            exit 1
          fi
          LOCAL_DIGEST="$(sha256sum "dist/$ASSET" | cut -d' ' -f1)"
          gh release upload "$VERSION" "dist/$ASSET" --repo "$GH_REPO"
          # The asset was not present before this step. If GitHub cannot
          # attest the expected digest, remove only this newly uploaded file;
          # never leave an unverifiable installer attached to a release.
          GITHUB_DIGEST=""
          UPLOADED_ID=""
          for attempt in 1 2 3 4 5; do
            GITHUB_DIGEST="$(gh api "repos/$GH_REPO/releases/tags/$VERSION" --jq '.assets[] | select(.name == "'"$ASSET"'") | .digest // empty')"
            UPLOADED_ID="$(gh api "repos/$GH_REPO/releases/tags/$VERSION" --jq '.assets[] | select(.name == "'"$ASSET"'") | .id')"
            if [[ "$GITHUB_DIGEST" == "sha256:$LOCAL_DIGEST" ]]; then
              break
            fi
            sleep 2
          done
          if [[ "$GITHUB_DIGEST" != "sha256:$LOCAL_DIGEST" ]]; then
            echo "::error::Published asset digest mismatch; removing just-uploaded unverified asset"
            if [[ "$UPLOADED_ID" =~ ^[0-9]+$ ]]; then
              gh api -X DELETE "repos/$GH_REPO/releases/assets/$UPLOADED_ID"
            fi
            exit 1
          fi
          echo "Published verified installer $ASSET sha256:$LOCAL_DIGEST" >> "$GITHUB_STEP_SUMMARY"
