name: Auto-promote verified dev to beta

on:
  push:
    branches: [dev]

# Write permissions belong to this isolated promotion workflow only.
# It never checks out or executes code from pull requests or forks.
permissions:
  contents: write
  actions: read

env:
  CI_PROMOTION_APP_ID: ${{ secrets.CI_PROMOTION_APP_ID }}

concurrency:
  group: opensigweave-verified-dev-to-beta
  cancel-in-progress: false

jobs:
  promote:
    name: Promote dev only after all source push checks pass
    if: github.repository == 'VeiglbergTech/OpenSigWeave'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the exact dev commit without persistent credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Obtain a short-lived GitHub App token if configured
        id: app-token
        if: env.CI_PROMOTION_APP_ID != ''
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.CI_PROMOTION_APP_ID }}
          private-key: ${{ secrets.CI_PROMOTION_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-contents: write
      - name: Wait for Tests, Security scan and relevant Postfix Milter CI
        shell: bash
        env:
          GH_REPO: '${{ github.repository }}'
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          SOURCE_SHA: '${{ github.sha }}'
          PREVIOUS_SHA: '${{ github.event.before }}'
        run: python3 scripts/auto_promote_beta.py

# The script fast-forwards beta to the exact CI-verified dev SHA without any
# merge/rebase/squash commit. GITHUB_TOKEN may not trigger beta push CI;
# the mandatory proof is the exact dev push Tests + Security scan.
# main remains strictly manual, and beta must be tested in a real environment.
