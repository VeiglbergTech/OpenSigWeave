name: Auto-promote verified dev to beta

on:
  push:
    branches: [dev]

# Default GITHUB_TOKEN stays read-only; only the GitHub App installation
# token has Contents write. No token with write access is exposed to PRs.
permissions:
  contents: read
  actions: read

concurrency:
  group: opensigweave-verified-dev-to-beta
  cancel-in-progress: false

jobs:
  promote:
    name: Promote dev only after all source push checks pass
    if: github.repository == 'VeiglbergTech/OpenSigWeave'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the exact dev commit without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Obtain repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.CI_PROMOTION_APP_ID }}
          private-key: ${{ secrets.CI_PROMOTION_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-contents: write
      - name: Wait for Tests, Security scan and relevant Postfix Milter CI
        shell: bash
        env:
          GH_REPO: '${{ github.repository }}'
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_SHA: '${{ github.sha }}'
          PREVIOUS_SHA: '${{ github.event.before }}'
        run: python3 scripts/auto_promote_beta.py

# The script fast-forwards beta to the exact CI-verified dev SHA without any
# merge/rebase/squash commit. GitHub App writes trigger beta push CI;
# successful exact-SHA dev push Tests + Security scan remain mandatory.
# Both CI_PROMOTION_APP_ID and CI_PROMOTION_APP_PRIVATE_KEY must be set,
# and the app must be installed on this repository.
# main remains strictly manual, and beta must be tested in a real environment.
