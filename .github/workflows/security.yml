name: Security scan

on:
  push:
    branches: [dev, beta]
  pull_request:
    branches: [dev, beta]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-audit:
    name: Python dependency and source audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit pinned Python dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          python -m pip_audit -r requirements.txt --strict
      - name: Static security analysis
        run: |
          python -m pip install --disable-pip-version-check bandit
          bandit -r . -x ./tests,./.git,./.venv -ll

  trivy:
    name: Filesystem vulnerabilities, misconfiguration and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Trivy repository scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
