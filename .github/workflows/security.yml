name: Security scan

on:
  push:
    branches: [dev, beta, main]
  pull_request:
    branches: [dev, beta, main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-audit:
    name: Python dependency and source audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Audit pinned Python dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          python -m pip_audit -r requirements.txt --strict
      - name: Static security analysis
        run: |
          python -m pip install --disable-pip-version-check bandit
          bandit -r . -x ./tests,./.git,./.venv -ll

  secret-history:
    name: Gitleaks full history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan complete Git history for secrets
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --config=.gitleaks.toml --redact=100 --report-format=json --report-path=/tmp/gitleaks-report.json --exit-code=0 --log-opts="--all" .
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/gitleaks-report.json").read_text())
          print(f"Gitleaks findings: {len(report)}")
          for finding in report:
              print(
                  "rule={RuleID} file={File} commit={Commit} line={StartLine} fingerprint={Fingerprint}".format(
                      **finding
                  )
              )
          if report:
              raise SystemExit("Unallowlisted secrets detected in Git history")
          PY
  trivy:
    name: Filesystem vulnerabilities, misconfiguration and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Trivy repository scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - name: Analyze source
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

  codeql-alert-gate:
    name: CodeQL open security findings gate
    needs: codeql
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      security-events: read
    steps:
      - name: Verify CodeQL analysis provenance and check outstanding alerts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Analysis ingestion can lag successful SARIF upload. Fail closed.
          found=0
          for _ in $(seq 1 12); do
            gh api "repos/$GH_REPO/code-scanning/analyses?ref=refs/heads/dev&per_page=100" > /tmp/codeql-analyses.json
            if python3 - "$COMMIT_SHA" <<'PY'
          import json,sys
          analyses=json.load(open('/tmp/codeql-analyses.json',encoding='utf-8'))
          matching=[a for a in analyses if a.get('commit_sha') == sys.argv[1] and a.get('tool',{}).get('name') == 'CodeQL']
          def read_language(a):
              raw=a.get('environment') or '{}'
              try:
                  env=json.loads(raw) if isinstance(raw,str) else raw
              except (ValueError,TypeError):
                  env={}
              lang=(env.get('language') if isinstance(env,dict) else None) or a.get('language')
              category=a.get('category') or ''
              if not lang and '/language:' in category:
                  lang=category.rsplit('/language:',1)[1]
              return (lang or '').lower()
          languages={read_language(a) for a in matching}
          has_python='python' in languages
          has_javascript=any(x.startswith('javascript') for x in languages)
          print('CodeQL analyses for exact dev commit:', len(matching), 'languages:', sorted(languages))
          sys.exit(0 if has_python and has_javascript else 1)
          PY
            then
              found=1
              break
            fi
            sleep 10
          done
          if [[ "$found" != 1 ]]; then
            echo "::error::No complete CodeQL analysis set found for exact dev commit $COMMIT_SHA"
            exit 1
          fi
          gh api --paginate --slurp "repos/$GH_REPO/code-scanning/alerts?state=open&ref=refs/heads/dev&per_page=100" > /tmp/codeql-alerts.json
          python3 - <<'PY'
          import json,os,sys
          pages=json.load(open('/tmp/codeql-alerts.json',encoding='utf-8'))
          if not isinstance(pages,list) or any(not isinstance(page,list) for page in pages):
              raise SystemExit('Unexpected code scanning alerts API response')
          alerts=[a for page in pages for a in page]
          relevant=[]
          for alert in alerts:
              rule=alert.get('rule') or {}
              severity=(rule.get('security_severity_level') or '').lower()
              if severity not in ('critical','high','medium'):
                  continue
              loc=(alert.get('most_recent_instance') or {}).get('location') or {}
              info=(severity,alert.get('number'),rule.get('id'),loc.get('path'),loc.get('start_line'))
              relevant.append(info)
              print('CodeQL security finding: severity=%s alert=%s rule=%s location=%s:%s' % info)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as summary:
              summary.write('### CodeQL open security findings (dev)\n')
              summary.write('Exact-sha CodeQL analysis confirmed. Open HIGH/MEDIUM/CRITICAL: %d\n' % len(relevant))
              summary.write('Findings require individual triage; a green CodeQL analysis job does not mean no vulnerabilities.\n')
          if relevant:
              print('::error::%d open CodeQL HIGH/MEDIUM/CRITICAL alerts on dev; block automatic promotion.' % len(relevant))
              sys.exit(1)
          PY

  docker-image-audit:
    name: Scan built application Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Build the production image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --tag opensigweave:security-scan .
          docker image inspect opensigweave:security-scan --format '{{.Id}}'
      # Report *all* OS/library issues, even when the distro has no patch yet.
      # Reporting must not be mistaken for an all-clear on unfixed vulnerabilities.
      - name: Full HIGH/CRITICAL vulnerability report (including unfixed)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: opensigweave:security-scan
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
          format: table
      # Block deployment for a HIGH/CRITICAL vulnerability with an available fix.
      # Debian-unfixed findings remain visible in the full report above.
      - name: Block fixable HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: opensigweave:security-scan
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - name: Document image scan gate
        shell: bash
        run: |
          {
            echo '### Docker image security scan'
            echo 'Full HIGH/CRITICAL findings (including unfixed) are reported in the first Trivy step.'
            echo 'The blocking step fails for HIGH/CRITICAL vulnerabilities with available upstream fixes.'
            echo 'Unfixed HIGH/CRITICAL findings remain a security risk and are **not** a clean bill of health.'
          } >> "$GITHUB_STEP_SUMMARY"
