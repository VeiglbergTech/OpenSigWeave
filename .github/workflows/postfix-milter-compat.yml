name: Postfix Milter Compatibility

on:
  push:
    branches: ["dev"]
    paths:
      - "docs/POSTFIX_MILTER_DESIGN.md"
      - ".github/workflows/postfix-milter-compat.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pymilter-runtime:
    name: Verify PyMilter 1.0.6 on Python 3.12
    runs-on: ubuntu-latest
    container: almalinux:10
    timeout-minutes: 10
    steps:
      - name: Install EPEL and PyMilter runtime
        shell: bash
        run: |
          set -euo pipefail
          dnf install -y epel-release
          dnf install -y python3 python3-pymilter
      - name: Verify Python and PyMilter versions
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          rpm -q --qf 'PyMilter RPM: %{VERSION}-%{RELEASE}\n' python3-pymilter
          python3 - <<'PY'
          import sys
          import Milter
          import milter

          assert sys.version_info[:2] == (3, 12), sys.version
          print(f"Python runtime: {sys.version.split()[0]}")
          print(f"Native extension: {milter.__file__}")
          print(f"Python API module: {Milter.__file__}")
          PY
      - name: Exercise PyMilter callback and mutation API
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import Milter

          class FakeContext:
              def __init__(self):
                  self.replacements = []
                  self.private = None

              def setpriv(self, value):
                  self.private = value

              def getsymval(self, name):
                  return {"{auth_authen}": "sender@example.org"}.get(name)

              def replacebody(self, chunk):
                  self.replacements.append(chunk)

          class Probe(Milter.Base):
              def __init__(self):
                  self.sender = None
                  self.headers = []
                  self.body_chunks = []

              def envfrom(self, sender, *args):
                  self.sender = sender
                  return Milter.CONTINUE

              def header(self, field, value):
                  self.headers.append((field, value))
                  return Milter.CONTINUE

              def body(self, chunk):
                  self.body_chunks.append(chunk)
                  return Milter.CONTINUE

              def eom(self):
                  self.replacebody(b"rewritten body")
                  return Milter.CONTINUE

          probe = Probe()
          context = FakeContext()
          probe._setctx(context)

          assert probe.envfrom("<sender@example.org>") == Milter.CONTINUE
          assert probe.sender == "<sender@example.org>"
          assert probe.getsymval("{auth_authen}") == "sender@example.org"
          assert probe.header("Content-Type", " text/plain") == Milter.CONTINUE
          assert probe.body(b"original body") == Milter.CONTINUE
          assert probe.eom() == Milter.CONTINUE
          assert context.replacements == [b"rewritten body"]

          print("Envelope sender callback: OK")
          print("SASL macro lookup: OK")
          print("Header callback: OK")
          print("Body callback: OK")
          print("End-of-message body replacement API: OK")
          PY
      - name: Verify native libmilter linkage
        shell: bash
        run: |
          set -euo pipefail
          extension="$(python3 -c 'import milter; print(milter.__file__)')"
          ldd "$extension"
          if ldd "$extension" | grep -q 'not found'; then
            echo "Unresolved native library dependency"
            exit 1
          fi
