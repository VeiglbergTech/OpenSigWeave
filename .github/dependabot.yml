version: 2
updates:
  - package-ecosystem: docker
    directory: /
    target-branch: beta
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      container-base-images:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /
    target-branch: beta
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    target-branch: beta
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
