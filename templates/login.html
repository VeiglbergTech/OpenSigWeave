<!DOCTYPE html>
<html lang="en" class="dark" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · {{ app_name }}</title>
    <link rel="stylesheet" href="/static/css/tailwind.css">
    <link rel="stylesheet" href="/static/css/portal.css">
    {% if has_favicon %}<link rel="icon" href="/branding/favicon">{% endif %}
    <script src="/static/js/theme.js"></script>
    <script defer src="/static/js/branding.js"></script>
</head>
<body class="min-h-screen bg-gray-900 text-gray-100 flex items-center justify-center p-6" data-app-color="{{ app_color|e }}">
    <main class="w-full max-w-md rounded-xl border border-gray-700 bg-gray-800 p-8 shadow-xl">
        {% if has_logo %}<img src="/branding/logo.png" alt="{{ app_name }} logo" class="max-h-32 max-w-full object-contain mx-auto mb-5">{% endif %}
        <div class="flex flex-wrap items-center justify-between gap-3 mb-6"><h1 class="text-2xl font-semibold app-brand">{{ app_name }}</h1><button id="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to light mode" class="rounded-md border border-gray-600 bg-gray-900 px-3 py-1.5 text-sm font-medium text-gray-300 hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500">Light mode</button></div>
        {% if error %}
        <p role="alert" class="mb-4 rounded bg-red-900/40 border border-red-700 p-3 text-sm">Invalid email address or password.</p>
        {% endif %}
        <form method="post" action="/login" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <label class="block text-sm" for="email">Email address
                <input class="mt-1 w-full rounded border border-gray-600 bg-gray-900 p-3 text-white" id="email" name="email" type="email" autocomplete="username" required maxlength="254">
            </label>
            <label class="block text-sm" for="password">Password
                <input class="mt-1 w-full rounded border border-gray-600 bg-gray-900 p-3 text-white" id="password" name="password" type="password" autocomplete="current-password" maxlength="1024">
            </label>
            <button class="w-full rounded bg-blue-600 hover:bg-blue-500 p-3 font-medium" type="submit">Sign in</button>
        </form>
        {% if oidc_providers %}
        <div class="my-6 flex items-center gap-3 text-xs uppercase tracking-wide text-gray-500">
            <span class="h-px flex-1 bg-gray-700"></span>
            <span>Or sign in with</span>
            <span class="h-px flex-1 bg-gray-700"></span>
        </div>
        <div class="space-y-3">
            {% for provider in oidc_providers %}
            <a class="block w-full rounded-lg border border-gray-600 bg-gray-900 hover:bg-gray-700 p-4 text-center font-medium transition" href="/login/oidc/{{ provider.id }}">
                Anmelden mit {{ provider.display_name }}
            </a>
            {% endfor %}
        </div>
        {% endif %}
    </main>
</body>
</html>
