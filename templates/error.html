<!DOCTYPE html>
<html lang="en" class="dark" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied</title>
    <link href="/static/css/tailwind.css" rel="stylesheet">
    <link href="/static/css/portal.css?v=ui-footer-tables-20261128" rel="stylesheet">
    <script src="/static/js/theme.js"></script>
    <script defer src="/static/js/branding.js"></script>
</head>
<body class="osw-auth-page min-h-screen bg-gray-900 text-gray-100 flex flex-col items-center justify-center p-6" data-app-color="{{ app_color|default('', true)|e }}" data-csrf-token="{{ csrf_token }}">
    <main class="osw-auth-card w-full max-w-md text-center p-8">
        <h1 class="text-2xl font-semibold text-red-500 mb-4">Access Denied</h1>
        <p class="text-gray-400">{{ message }}</p>
        <button id="logout-button" type="button" class="mt-6 inline-block text-blue-400 hover:text-blue-300">Sign out and use a different account</button>
    </main>
    <footer class="osw-site-footer" aria-label="Application attribution"><a href="https://github.com/VeiglbergTech/OpenSigWeave" target="_blank" rel="noopener noreferrer">Powered by OpenSigWeave</a></footer>
    <script src="/static/js/logout.js"></script>
</body>
</html>
